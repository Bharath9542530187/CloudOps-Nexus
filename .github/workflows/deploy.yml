name: CloudOps Nexus CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check Python and backend syntax
        run: |
          python3 --version
          python3 -m compileall -q backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check Docker Compose file
        run: docker-compose config -q

      - name: Deploy on EC2
        run: |
          if [ -f /home/ec2-user/cloudops-backend/.env ]; then
            cp /home/ec2-user/cloudops-backend/.env .env
          fi
          docker-compose up -d --build --remove-orphans
          docker image prune -f
          docker-compose ps
