name: CloudOps Nexus CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check Python and backend syntax
        run: |
          python3 --version
          python3 -m compileall -q backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deployment environment
        run: |
          set -e
          ENV_SOURCE="/home/ec2-user/cloudops-backend/.env"
          if [ ! -f "$ENV_SOURCE" ]; then
            echo "ERROR: Deployment .env file not found at $ENV_SOURCE"
            exit 1
          fi

          cp "$ENV_SOURCE" "$GITHUB_WORKSPACE/.env"
          chmod 600 "$GITHUB_WORKSPACE/.env"

          for key in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AWS_REGION EC2_INSTANCE_ID; do
            if ! grep -Eq "^${key}=[^[:space:]]" "$GITHUB_WORKSPACE/.env"; then
              echo "ERROR: $key is missing or empty in deployment .env"
              exit 1
            fi
            echo "$key is configured"
          done

          docker-compose config -q
          echo "Docker Compose configuration is valid."

      - name: Deploy on EC2
        run: |
          set -e
          docker-compose up -d --build --remove-orphans || {
            echo "Deployment failed. PostgreSQL and service logs:"
            docker-compose ps -a
            docker-compose logs --no-color --tail=100 database || true
            exit 1
          }
          docker-compose ps
